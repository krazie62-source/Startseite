<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startseite</title>

<style>
body {
  font-family: Arial;
  background: #004080;
  color: yellow;
  margin: 0;
  padding: 20px;
  text-align: center;
}

form {
  margin-bottom: 20px;
}

input, button {
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  background: yellow;
  color: #004080;
  cursor: pointer;
}

.container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.column {
  background: #003366;
  padding: 10px;
  border-radius: 10px;
  min-height: 200px;
}

.link-item {
  background: #0055aa;
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  cursor: grab;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.link-item a {
  color: yellow;
  text-decoration: none;
  font-weight: bold;
}

@media(max-width:900px){
  .container { grid-template-columns: repeat(2, 1fr); }
}

@media(max-width:500px){
  .container { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<h1>🌍 Startseite</h1>

<form id="linkForm">
  <input type="text" id="name" placeholder="Name" required>
  <input type="url" id="url" placeholder="https://..." required>
  <button type="submit">➕</button>
  <button type="button" onclick="exportLinks()">💾</button>
  <input type="file" onchange="importLinks(event)">
</form>

<div class="container">
  <div class="column" data-col="0"><h3>📰 News</h3></div>
  <div class="column" data-col="1"><h3>⚽ Sport</h3></div>
  <div class="column" data-col="2"><h3>🏠 Home</h3></div>
  <div class="column" data-col="3"><h3>⭐ Sonst</h3></div>
</div>

<script>
const GET_URL = "https://api.jsonstorage.net/v1/json/f437dc9f-9db5-4810-901a-b1b82168b89a/11d7832a-1d3e-4fa6-8b7a-7f278d9d617e";
const PUT_URL = "https://api.jsonstorage.net/v1/json/f437dc9f-9db5-4810-901a-b1b82168b89a/11d7832a-1d3e-4fa6-8b7a-7f278d9d617e?apiKey=46e42784-3612-4fa3-b9b0-15ccccad363e"; // MIT API KEY

let links = [];
let dragIndex = null;

// ✅ Laden
function laden() {
  fetch(GET_URL + "?t=" + Date.now())
    .then(res => res.json())
    .then(data => {
      links = Array.isArray(data) ? data : [];
      anzeigen();
    });
}

// ✅ Speichern
function speichern() {
  fetch(PUT_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(links)
  });
}

// ✅ Anzeigen
function anzeigen() {
  document.querySelectorAll(".column").forEach(col => {
    const title = col.querySelector("h3").outerHTML;
    col.innerHTML = title;
  });

  links.forEach((link, index) => {
    const div = document.createElement("div");
    div.className = "link-item";
    div.draggable = true;

    div.innerHTML = `
      <a href="${link.url}" target="_blank">${link.name}</a>
      <button onclick="loeschen(${index})">❌</button>
    `;

div.addEventListener("dragstart", () => dragIndex = index);

    const column = document.querySelector(`.column[data-col="${link.col || 0}"]`);
    column.appendChild(div);
  });
}

// ✅ Drag & Drop Spalten
document.querySelectorAll(".column").forEach(col => {

  col.addEventListener("dragover", e => e.preventDefault());

  col.addEventListener("drop", () => {
    links[dragIndex].col = parseInt(col.dataset.col);
    speichern();
    anzeigen();
  });

});

// ✅ Löschen
function loeschen(index) {
  if (!confirm("Link löschen?")) return;

  links.splice(index, 1);
  speichern();
  anzeigen();
}

// ✅ Hinzufügen
document.getElementById("linkForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const nameInput = document.getElementById("name");
  const urlInput = document.getElementById("url");

  links.push({
    name: nameInput.value,
    url: urlInput.value,
    col: 0
  });

  speichern();
  anzeigen();
  this.reset();
});
//~ document.getElementById("linkForm").addEventListener("submit", function(e) {
  //~ e.preventDefault();

  //~ links.push({
    //~ name: name.value,
    //~ url: url.value,
    //~ col: 0
  //~ });

  //~ speichern();
  //~ anzeigen();
  //~ this.reset();
//~ });

// ✅ Backup Export
function exportLinks() {
  const now = new Date();

  const timestamp =
    now.getFullYear().toString() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0") + "_" +
    String(now.getHours()).padStart(2, "0") +
    String(now.getMinutes()).padStart(2, "0") +
    String(now.getSeconds()).padStart(2, "0");

  const filename = "Stpg_" + timestamp + ".json";

  const blob = new Blob([JSON.stringify(links, null, 2)], {
    type: "application/json"
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

//~ function exportLinks() {
  //~ const blob = new Blob([JSON.stringify(links, null, 2)], {type: "application/json"});
  //~ const a = document.createElement("a");
  //~ a.href = URL.createObjectURL(blob);
  //~ a.download = "backup.json";
  //~ a.click();
//~ }

// ✅ Backup Import
function importLinks(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    const data = JSON.parse(e.target.result);
    if (Array.isArray(data)) {
      if (confirm("Backup laden?")) {
        links = data;
        speichern();
        anzeigen();
      }
    }
  };

  reader.readAsText(file);
}

// ✅ Start
laden();
</script>

</body>
</html>
