<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startseite</title>

<style>

googleSearch {
  margin-bottom: 20px;
}

googleSearch input {
  width: 600px;
  max-width: 90%;
  padding: 15px;
  font-size: 20px;
  border-radius: 30px;
  border: none;
  text-align: center;
}
  
body {
  font-family: Arial;
  background: #004080;
  color: yellow;
  margin: 0;
  padding: 20px;
  text-align: center;
}

input, button {
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  background: yellow;
  color: #004080;
  cursor: pointer;
}

.container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.column {
  background: #003366;
  padding: 10px;
  border-radius: 10px;
  min-height: 200px;
}

.link-item {
  background: #0055aa;
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

.link-item a {
  color: yellow;
  text-decoration: none;
  font-weight: bold;
}

.menu-btn {
  cursor: pointer;
  font-size: 18px;
}

.menu {
  display: none;
  position: absolute;
  right: 5px;
  top: 30px;
  background: #003366;
  border-radius: 8px;
  padding: 5px;
  z-index: 10;
}

.menu button {
  display: block;
  width: 100%;
  margin: 2px 0;
  font-size: 12px;
}

@media(max-width:900px){
  .container { grid-template-columns: repeat(2, 1fr); }
}

@media(max-width:500px){
  .container { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<h1>🌍 Startseite</h1>

<form id="googleSearch"
      action="https://www.google.com/search"
      method="get"
      targeturchsuchen..."
      autofocus>

</form>
  
<form action="https://www.google.com/search" method="get" target="_blank" id="older="Google durchsuchen..."
    style="
      width: 400px;
      max-width: 80%;
      padding: 12px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
    ">
  <button type="submit">🔍</button>
</form>

<br>

<form id="linkForm">
  <input type="text" id="name" placeholder="Name" required>
  <input type="url" id="url" placeholder="https://..." required>
  <button type="submit">➕</button>
  <button type="button" onclick="exportLinks()">💾</button>
  <input type="file" onchange="importLinks(event)">
</form>

<div class="container">
  <div class="column" data-col="0"><h3>📰 News</h3></div>
  <div class="column" data-col="1"><h3>⚽ Sport</h3></div>
  <div class="column" data-col="2"><h3>🏠 Home</h3></div>
  <div class="column" data-col="3"><h3>⭐ Sonst</h3></div>
</div>

<script>
const GET_URL = "https://api.jsonstorage.net/v1/json/f437dc9f-9db5-4810-901a-b1b82168b89a/11d7832a-1d3e-4fa6-8b7a-7f278d9d617e";
const PUT_URL = "https://api.jsonstorage.net/v1/json/f437dc9f-9db5-4810-901a-b1b82168b89a/11d7832a-1d3e-4fa6-8b7a-7f278d9d617e?apiKey=46e42784-3612-4fa3-b9b0-15ccccad363e"; // MIT API KEY

let links = [];
let dragIndex = null;

// ✅ Laden
function laden() {
  fetch(GET_URL + "?t=" + Date.now())
    .then(res => res.json())
    .then(data => {
      links = Array.isArray(data) ? data : [];
      anzeigen();
    });
}

// ✅ Speichern
function speichern() {
  fetch(PUT_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(links)
  });
}

// ✅ Anzeige
function anzeigen() {
  document.querySelectorAll(".column").forEach(col => {
    const title = col.querySelector("h3").outerHTML;
    col.innerHTML = title;
  });

  links.sort((a,b)=>a.col-b.col||a.order-b.order)
  .forEach((link,index)=>{

    const div = document.createElement("div");
    div.className="link-item";
    div.draggable=true;

    div.innerHTML = `
      <a href="${link.url}" target="_blank">${link.name}</a>
      <span class="menu-btn" onclick="toggleMenu(${index})">⋮</span>

      <div class="menu" id="menu-${index}">
        <button onclick="hoch(${index})">⬆ Hoch</button>
        <button onclick="runter(${index})">⬇ Runter</button>
        <button onclick="linksBewegen(${index})">⬅ Links</button>
        <button onclick="rechtsBewegen(${index})">➡ Rechts</button>
        <button onclick="loeschen(${index})">❌ Löschen</button>
      </div>
    `;

    div.addEventListener("dragstart",()=>dragIndex=index);
    div.addEventListener("dragover",e=>e.preventDefault());

    div.addEventListener("drop",()=>{
      const moved=links[dragIndex];
      links.splice(dragIndex,1);
      links.splice(index,0,moved);
      links.forEach((l,i)=>l.order=i);
      speichern(); anzeigen();
    });

    document.querySelector(`.column[data-col="${link.col||0}"]`).appendChild(div);
  });
}

// ✅ Menü
function toggleMenu(i){
  document.querySelectorAll(".menu").forEach(m=>m.style.display="none");
  const m=document.getElementById("menu-"+i);
  m.style.display = m.style.display==="block" ? "none" : "block";
}

document.addEventListener("click",e=>{
  if(!e.target.closest(".menu") && !e.target.closest(".menu-btn")){
    document.querySelectorAll(".menu").forEach(m=>m.style.display="none");
  }
});

// ✅ Moves
function hoch(i){
  // nur innerhalb derselben Spalte verschieben
  const aktueller = links[i];

  // finde alle Links in derselben Spalte
  const gleicheSpalte = links
    .map((l, idx) => ({...l, idx}))
    .filter(l => l.col === aktueller.col)
    .sort((a, b) => a.order - b.order);

  // finde Position in der Spalte
  const pos = gleicheSpalte.findIndex(l => l.idx === i);

  if (pos <= 0) return; // schon oben

  const andererIndex = gleicheSpalte[pos - 1].idx;

  // order tauschen
  const tmp = links[i].order;
  links[i].order = links[andererIndex].order;
  links[andererIndex].order = tmp;

  speichern();
  anzeigen();
}


function runter(i){
  if(i >= links.length - 1) return;

  const tmp = links[i].order;
  links[i].order = links[i+1].order;
  links[i+1].order = tmp;

  speichern();
  anzeigen();
}


function linksBewegen(i){
  if(links[i].col>0){links[i].col--; speichern(); anzeigen();}
}

function rechtsBewegen(i){
  if(links[i].col<3){links[i].col++; speichern(); anzeigen();}
}

// ✅ löschen
function loeschen(i){
  if(!confirm("Link löschen?")) return;
  links.splice(i,1);
  speichern(); anzeigen();
}

// ✅ hinzufügen
//~ linkForm.onsubmit=e=>{
  //~ e.preventDefault();

  //~ links.push({
    //~ name:name.value,
    //~ url:url.value,
    //~ col:0,
    //~ order:Date.now()
  //~ });

  //~ speichern();
  //~ anzeigen();
  //~ linkForm.reset();
//~ };
linkForm.onsubmit = e => {
  e.preventDefault();

  const nameInput = document.getElementById("name");
  const urlInput = document.getElementById("url");

  links.push({
    name: nameInput.value,
    url: urlInput.value,
    col: 0,
    order: Date.now()
  });

  speichern();
  anzeigen();
  linkForm.reset();
};
// ✅ Backup
function exportLinks(){
  const d=new Date();
  const ts=d.getFullYear()+
    String(d.getMonth()+1).padStart(2,"0")+
    String(d.getDate()).padStart(2,"0")+"_"+ 
    String(d.getHours()).padStart(2,"0")+
    String(d.getMinutes()).padStart(2,"0")+
    String(d.getSeconds()).padStart(2,"0");

  const blob=new Blob([JSON.stringify(links,null,2)]);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Stpg_"+ts+".json";
  a.click();
}

// ✅ Import
function importLinks(e){
  const file=e.target.files[0];
  if(!file) return;

  const r=new FileReader();
  r.onload=ev=>{
    const data=JSON.parse(ev.target.result);
    if(Array.isArray(data)){
      if(confirm("Backup laden?")){
        links=data;
        speichern(); anzeigen();
      }
    }
  };
  r.readAsText(file);
}

// ✅ Start
laden();
</script>

</body>
</html>
